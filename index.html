<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>AstinTech POS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#101827;color:white;padding:18px}
header h2{margin:0 0 7px;color:#fbbf24}
header p{margin:0;font-size:13px;color:#cbd5e1}
nav{display:flex;gap:7px;overflow-x:auto;padding:12px;background:white}
nav button,button{border:0;border-radius:7px;padding:11px 14px;background:#172033;color:white;cursor:pointer}
nav button{white-space:nowrap}
main{padding:15px;max-width:1100px;margin:auto}
.panel,.card{background:white;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000b}
h3{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.metric{background:#fff;padding:16px;border-radius:10px}
.metric strong{display:block;font-size:23px;margin-top:8px}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:7px;margin:6px 0 12px;background:white}
label{font-size:13px;font-weight:bold}
.primary{background:#087f5b}
.gold{color:#b77900}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0;font-size:13px}
.tablewrap{overflow-x:auto}
.small{font-size:12px;color:#64748b}
.danger{background:#b91c1c}
section[hidden]{display:none}
footer{text-align:center;padding:20px;color:#64748b;font-size:12px}
</style>
</head>
<body>
<header>
<h2>ASTINTECH POS</h2>
<p>2026 Edition | Powered by Astin Tech</p>
</header>

<nav>
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('sales')">Sales</button>
<button onclick="show('stock')">Stock</button>
<button onclick="show('rooms')">Rooms</button>
<button onclick="show('gate')">Gate Security</button>
<button onclick="show('reports')">Reports</button>
</nav>

<main>
<section id="dashboard">
<div class="panel">
<h3>Welcome to your POS</h3>
<p>Manage restaurant sales, inventory and hotel operations.</p>
<label>Current staff role (demo)</label>
<select id="role" onchange="updateRole()">
<option>Staff</option>
<option>Manager</option>
<option>Admin</option>
<option>Super Admin</option>
</select>
<p id="roleMessage" class="small">Demonstration role selector; not a security lock.</p>
</div>
<div class="grid">
<div class="metric">Today's sales<strong
